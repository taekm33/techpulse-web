name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'next.config.ts'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Validate bilingual content quality gate
        env:
          EVENT_BASE_SHA: ${{ github.event.before }}
        run: |
          BASE_SHA="$(git rev-parse 'refs/tags/production^{commit}' 2>/dev/null || true)"
          if [ -z "$BASE_SHA" ]; then BASE_SHA="$EVENT_BASE_SHA"; fi
          echo "quality baseline: $BASE_SHA"
          python3 scripts/content_quality_gate.py --base "$BASE_SHA"
      - name: Validate embeds & links (pre-deploy)
        run: node scripts/validate-embeds.mjs
      - name: Build & deploy KR (techpulse.co.kr)
        env:
          NEXT_PUBLIC_LOCALE: kr
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm run build
          python3 scripts/validate_static_export.py --locale kr --out out
          npx wrangler pages deploy out --project-name=techpulse-kr --branch=main --commit-dirty=true
      - name: Build & deploy EN (technologypulse.app)
        env:
          NEXT_PUBLIC_LOCALE: en
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          rm -rf out .next
          npm run build
          python3 scripts/validate_static_export.py --locale en --out out
          npx wrangler pages deploy out --project-name=techpulse-en --branch=main --commit-dirty=true
      - name: Heal source if embeds were auto-removed
        if: always()
        run: |
          if [ -n "$(git status --porcelain content/)" ]; then
            git config user.name "techpulse-embed-bot"
            git config user.email "actions@github.com"
            git add content/
            git commit -m "fix(embeds): auto-remove invalid youtube embeds [skip ci]"
            git pull --rebase origin main || true
            git push || echo "push skipped (non-fatal): live deploy already used the cleaned content"
          else
            echo "no embed fixes to commit"
          fi
      - name: Mark successfully deployed content baseline
        if: success()
        run: |
          git tag -f production HEAD
          git push --force origin refs/tags/production
